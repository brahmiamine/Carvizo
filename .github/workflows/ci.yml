name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: carvizo_ci
          MARIADB_USER: carvizo
          MARIADB_PASSWORD: carvizo_ci_pass
          MARIADB_ROOT_PASSWORD: carvizo_root_ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://carvizo:carvizo_ci_pass@127.0.0.1:3306/carvizo_ci
      CRON_SECRET: ci_only_aaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Tester le schéma contre une vraie MariaDB
        run: npx prisma db push
      - run: npm run build
      - name: Test HTTP des parcours et droits d'accès
        run: node --test tests/smoke.mjs
